# "org" ensures this Service is used with the correct Serverless Framework Access Key.
#org: mafaia9or10
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: mafia9or10
service: mafia9or10
frameworkVersion: '4.1.5'

stages:
  default:
    resolvers:
      aws-account-1:
        type: aws
        region: us-west-2
        accessKeyId: ${env:ACCOUNT1_AWS_ACCESS_KEY_ID}
        secretAccessKey: ${env:ACCOUNT1_AWS_SECRET_ACCESS_KEY}
        dashboard: false

build:
  esbuild:
    bundle: true
    minify: false
    external: []

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: us-west-2
  environment:
    S3_BUCKET: mafia9or10-avatars
    # Resend (вимкнено в коді; лишайте порожнім або приберіть)
    # RESEND_API_KEY: ${env:RESEND_API_KEY, ''}
    # RESEND_FROM_EMAIL: ${env:RESEND_FROM_EMAIL, ''}
    # SendGrid (вимкнено в коді)
    # SENDGRID_API_KEY: ${env:SENDGRID_API_KEY, ''}
    # SENDGRID_FROM_EMAIL: ${env:SENDGRID_FROM_EMAIL, ''}
    # SENDGRID_FROM_NAME: ${env:SENDGRID_FROM_NAME, '9or10 Mafia'}
    # Mailtrap: https://mailtrap.io/api-tokens — transactional або sandbox inbox
    MAILTRAP_API_TOKEN: ${env:MAILTRAP_API_TOKEN, ''}
    MAILTRAP_API_KEY: ${env:MAILTRAP_API_KEY, ''}
    MAILTRAP_FROM_EMAIL: ${env:MAILTRAP_FROM_EMAIL, ''}
    MAILTRAP_FROM_NAME: ${env:MAILTRAP_FROM_NAME, '9or10 Mafia'}
    MAILTRAP_USE_SANDBOX: ${env:MAILTRAP_USE_SANDBOX, ''}
    MAILTRAP_INBOX_ID: ${env:MAILTRAP_INBOX_ID, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: arn:aws:s3:::mafia9or10-avatars/*

functions:
  api:
    timeout: 30
    memorySize: 1024
    handler: handler.handler
    events:
      - httpApi: "*"
#      - http:
#          path: /
#          method: ANY
#          cors: true
#      - http:
#          path: /{proxy+}
#          method: ANY
#          cors: true